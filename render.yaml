# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo on render.com, it auto-detects this file.

services:
  - type: web
    name: ai-revenue-recovery-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel URL after frontend deploy
      - key: DISABLE_DEDUP
        value: "false"
